<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zion Prompt Leak Scanner</title>
<meta name="description" content="Paste prompts or config files — find API keys, tokens, PII and internal data before you commit. 100% client-side. By Zion Tech Group.">
<style>
:root{--bg:#120b0b;--card:#1f1414;--acc:#f87171;--txt:#faecec;--mut:#c29d9d}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}
header{padding:48px 24px 24px;text-align:center;background:linear-gradient(160deg,#3d1212,#120b0b)}
h1{margin:0 0 8px}.wrap{max-width:920px;margin:0 auto;padding:24px}
.panel{background:var(--card);border:1px solid #3a1e1e;border-radius:14px;padding:20px;margin-bottom:20px}
textarea{width:100%;min-height:200px;padding:12px;border-radius:10px;border:1px solid #4a2828;background:#170e0e;color:var(--txt);font-family:ui-monospace,monospace;font-size:.85rem}
button{margin-top:14px;padding:12px 22px;border:0;border-radius:10px;background:var(--acc);color:#2a0a0a;font-weight:700;cursor:pointer}
.finding{display:flex;gap:10px;background:#170e0e;border:1px solid #3a1e1e;border-radius:10px;padding:10px 14px;margin:6px 0;font-size:.88rem;align-items:center}
.sev{padding:2px 10px;border-radius:12px;font-size:.72rem;font-weight:700}
.crit{background:#7f1d1d;color:#fecaca}.high{background:#78350f;color:#fde68a}.med{background:#1e3a5f;color:#bfdbfe}
.ok{color:#34d399;font-weight:700;font-size:1.1rem}
footer{padding:32px 24px;text-align:center;color:var(--mut);font-size:.85rem;border-top:1px solid #2c1818;margin-top:40px}
footer a{color:var(--acc);text-decoration:none;margin:0 8px}
</style>
</head>
<body>
<header><h1>🕵️ Zion Prompt Leak Scanner</h1>
<p>Paste a system prompt, agent config or MCP config. We scan for secrets and PII locally — nothing leaves your browser.</p></header>
<div class="wrap">
<div class="panel"><textarea id="src" placeholder="Paste system prompt, mcp.json, agent config…"></textarea><button onclick="scan()">Scan</button></div>
<div class="panel" id="result" style="display:none"><div id="findings"></div></div>
</div>
<footer>Part of the <a href="https://ziontechgroup.com">Zion Tech Group</a> AI apps network ·
<a href="https://ziontechgroup.com/zion-mcp-security/">MCP Security</a>
<a href="https://ziontechgroup.com/zion-prompt-ab-playground/">Prompt A/B</a>
<a href="https://ziontechgroup.com/zion-verifier/">Zion Verifier</a></footer>
<script>
const RULES=[
[/sk-[A-Za-z0-9_-]{20,}/g,'OpenAI-style API key','crit'],
[/sk_live_[A-Za-z0-9]{10,}/g,'Stripe LIVE secret key','crit'],
[/rk_live_[A-Za-z0-9]{10,}/g,'Stripe live restricted key','high'],
[/ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}/g,'GitHub token','crit'],
[/xox[bpoa]-[A-Za-z0-9-]{10,}/g,'Slack token','crit'],
[/ntn_[A-Za-z0-9]{20,}/g,'Notion integration token','high'],
[/AKIA[0-9A-Z]{16}/g,'AWS access key ID','crit'],
[/-----BEGIN [A-Z ]*PRIVATE KEY-----/g,'Private key material','crit'],
[/glsa-[A-Za-z0-9_-]{20,}/g,'Grafana service account token','high'],
[/\bBearer\s+[A-Za-z0-9._-]{20,}/g,'Hardcoded Bearer token','high'],
[/\b\d{3}-\d{2}-\d{4}\b/g,'US SSN pattern','high'],
[/\b[\w.+-]+@[\w-]+\.[\w.]+\b/g,'Email address (possible PII)','med'],
[/\b(?:\d[ -]?){13,16}\b/g,'Possible payment card number','high'],
[/password\s*[:=]\s*["']?\S+/gi,'Hardcoded password','high'],
[/internal\.(corp|local)|\b10\.\d+\.\d+\.\d+\b|\b192\.168\./g,'Internal hostname/IP','med']];
function scan(){const t=document.getElementById('src').value;if(!t.trim())return;
const f=[];for(const[re,name,sev]of RULES){const m=t.match(re);if(m)f.push([sev,name,m.length,m[0].slice(0,6)+'…']);}
document.getElementById('result').style.display='block';
document.getElementById('findings').innerHTML=f.length?f.map(([s,n,c,x])=>`<div class="finding"><span class="sev ${s}">${s.toUpperCase()}</span><span><b>${n}</b> — ${c} occurrence(s), e.g. <code>${x}</code></span></div>`).join('')+`<p style="color:var(--mut);font-size:.85rem">Rotate anything flagged CRITICAL immediately — committed secrets are compromised secrets.</p>`:'<div class="ok">✓ No leaks detected. Still: prefer env vars/secrets managers over inline config.</div>';}
</script>
</body>
</html>
