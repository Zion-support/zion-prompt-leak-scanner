<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Prompt Leak Scanner</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}textarea{width:100%;padding:.5rem}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px;margin-top:.5rem}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>🔍 Prompt Leak Scanner</h1><p>Paste a prompt/config to scan for secrets and PII.</p><textarea id="t" rows="5" placeholder="Paste prompt or config..."></textarea><br><button onclick="go()">Scan</button><div id="out"></div><script>function go(){const t=document.getElementById('t').value;const checks={'API key / token':/(sk-[a-zA-Z0-9]{10,}|api[_-]?key|token|bearer)/i,'Email address':/[\w.]+@[\w.]+\.\w+/,'Phone number':/\+?\d[\d\s\-()]{8,}/,'Credit card':/\b\d{4}[\s-]?\d{4}[\s-]?\d{4}[\s-]?\d{4}\b/,'Private key':/BEGIN (RSA |EC )?PRIVATE KEY/,'Password in text':/password\s*[:=]/i};let hits=[];for(const[k,re]of Object.entries(checks))if(re.test(t))hits.push('🔴 '+k);document.getElementById('out').textContent=(hits.length?hits.join('\n')+'\n\n⚠️ Remove/redact before sending to any LLM.':'🟢 No leaks detected')+'\n\nCI-integrated scanning for your whole repo: commercial@ziontechgroup.com'}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/zion-prompt-leak-scanner">GitHub</a> · <a href="https://ziontechgroup.com/prompt-shield/">Prompt Shield</a></p></body></html>
